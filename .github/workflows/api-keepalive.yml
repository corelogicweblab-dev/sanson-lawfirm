# Keeps Render API warm — avoids 30–60s cold-start delays on Firebase Hosting.
name: API Keep-Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health
        run: |
          curl -fsSL --max-time 45 "https://sanson-lawfirm.onrender.com/api/v1/health/" \
            | grep -q '"status":"healthy"'
      - name: Ping ready
        run: |
          curl -fsSL --max-time 45 "https://sanson-lawfirm.onrender.com/api/v1/health/ready" \
            || true
