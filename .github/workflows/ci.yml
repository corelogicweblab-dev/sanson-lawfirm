name: CI

on:
  pull_request:
    branches: [main, staging, development]
  push:
    branches: [development, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate environment templates
        run: node scripts/validate-env.js --check-templates

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  backend-smoke:
    name: Backend import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Compile Python
        working-directory: apps/backend
        run: python -m compileall app -q

  migration-manifest:
    name: Migration manifest check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/migrate-pipeline.js --check
