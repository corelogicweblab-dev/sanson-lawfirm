# Render — Python API (no Docker required)
# Web app deploys separately via Firebase Hosting (npm run deploy:hosting)
services:
  - type: web
    name: sanson-lawfirm
    runtime: python
    rootDir: apps/backend
    buildCommand: bash build-render.sh
    startCommand: bash start.sh
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://sansonlawfirm.web.app,https://sansonlawfirm.firebaseapp.com,https://sanson-lawfirm.onrender.com
      - key: FRONTEND_URL
        value: https://sanson-lawfirm.onrender.com
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
